<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none" role="img" aria-label="Onboarding illustration">
  <defs>
    <linearGradient id="ob-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EBE6DE"/>
    </linearGradient>
    <linearGradient id="ob-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E85D4C"/>
      <stop offset="100%" stop-color="#D94432"/>
    </linearGradient>
  </defs>
  <rect width="320" height="280" rx="24" fill="url(#ob-bg)"/>
  <!-- phone -->
  <rect x="108" y="40" width="104" height="180" rx="20" fill="#1A1816"/>
  <rect x="114" y="52" width="92" height="156" rx="14" fill="#F7F5F2"/>
  <rect x="138" y="46" width="44" height="8" rx="4" fill="#2A2826"/>
  <!-- incoming call UI -->
  <circle cx="160" cy="110" r="28" fill="url(#ob-brand)"/>
  <circle cx="160" cy="104" r="12" fill="#F0D0B8"/>
  <text x="160" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1A1816">Sarah</text>
  <text x="160" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B6560">Incoming call&</text>
  <!-- accept button -->
  <circle cx="160" cy="188" r="14" fill="#30D158"/>
  <path d="M155 188 L160 193 L168 182" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- chat bubbles floating -->
  <ellipse cx="72" cy="100" rx="36" ry="24" fill="#FFF" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="72" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B6560">Hey!</text>
  <ellipse cx="248" cy="130" rx="40" ry="26" fill="url(#ob-brand)"/>
  <text x="248" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#FFF">Let's chat</text>
  <!-- wave decoration -->
  <path d="M40 230 Q60 210 80 230 T120 230" stroke="#D94432" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M200 230 Q220 210 240 230 T280 230" stroke="#D94432" stroke-width="2" fill="none" opacity="0.3"/>
</svg>
