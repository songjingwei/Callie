<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Callie — 来电</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/assets.css" />
</head>
<body class="screen-page">
  <nav class="screen-page__nav"><a class="link-back" href="../index.html">← Design System</a></nav>
  <div class="device device--dark">
    <div class="device__island"></div>
    <div class="device__screen">
      <div class="device__status device__status--dark"><span>9:41</span><span>5G</span></div>
      <div class="device__content">
        <div class="call-screen">
          <div class="call-screen__partner">
            <img class="avatar-img avatar-img--2xl" src="../assets/avatars/avatar-sarah.png" alt="Sarah" />
            <h1 class="call-screen__name">Sarah</h1>
            <p class="call-screen__status">正在呼叫你…</p>
            <p class="call-screen__status" style="margin-top:var(--space-2);font-size:var(--text-sm)">美式英语 · 日常闲聊</p>
          </div>
          <div class="call-controls call-controls--incoming">
            <div class="call-control-group">
              <button class="btn btn--call-decline" type="button" aria-label="拒接">
                <svg class="btn-icon--lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
              <span class="call-control-label">拒接</span>
            </div>
            <div class="call-control-group">
              <button class="btn btn--call-accept" type="button" aria-label="接听">
                <svg class="btn-icon--lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </button>
              <span class="call-control-label">接听</span>
            </div>
          </div>
        </div>
      </div>
      <div class="device__home-indicator"></div>
    </div>
  </div>
  <p class="screen-page__label">04 · Incoming Call — 生产环境由 CallKit 系统 UI 承载；此为 App 内 fallback 参考</p>
</body>
</html>
