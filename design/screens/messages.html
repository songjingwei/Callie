<!DOCTYPE html>
<html lang="zh-Hans" class="screen-chrome">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Callie — 消息</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/assets.css" />
</head>
<body class="screen-page">
  <nav class="screen-page__nav"><a class="link-back" href="../index.html">← Design System</a></nav>
  <div class="screen-page__toolbar">
    <div class="theme-toggle" role="group" aria-label="设备主题">
      <button type="button" class="theme-toggle__btn theme-toggle__btn--active" data-theme-btn="light">Light</button>
      <button type="button" class="theme-toggle__btn" data-theme-btn="dark">Dark</button>
    </div>
  </div>
  <div class="device" data-theme="light">
    <div class="device__island"></div>
    <div class="device__screen">
      <div class="device__status device__status--light"><span>9:41</span><span>5G</span></div>
      <div class="device__content device__content--with-tab">
        <div class="page page--rich">
          <header class="page-header page-header--large page-header--toolbar">
            <h1 class="page-title">消息</h1>
            <a class="nav-icon-btn nav-icon-btn--brand" href="add-partner.html" aria-label="添加 AI 伙伴">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </a>
          </header>

          <div class="hero-strip">
            <div class="hero-strip__text">
              <h2>今日还没练口语</h2>
              <p>Sarah 在线 · 随时可聊</p>
            </div>
            <span class="hero-strip__badge">去通话</span>
          </div>

          <div class="page-body page-body--flush">
            <div class="conversation-panel">
              <ul class="conversation-list">
                <li>
                  <div class="conversation-row">
                    <a class="conversation-row__avatar-link" href="partner-profile.html" aria-label="查看 Sarah 资料">
                      <span class="avatar-wrap">
                        <img class="avatar-img" src="../assets/avatars/avatar-sarah.png" alt="Sarah" />
                        <span class="avatar__badge"></span>
                      </span>
                    </a>
                    <a class="conversation-row__body" href="chat.html" style="flex:1;min-width:0;display:block">
                      <div class="conversation-row__top">
                        <span class="conversation-row__name">Sarah</span>
                        <span class="conversation-row__time">2 分钟前</span>
                      </div>
                      <p class="conversation-row__preview conversation-row__preview--unread">Hey! Are you free for a quick chat?</p>
                    </a>
                    <span class="conversation-row__unread" aria-hidden="true"></span>
                  </div>
                </li>
                <li>
                  <div class="conversation-row">
                    <a class="conversation-row__avatar-link" href="partner-profile.html?partner=alex">
                      <img class="avatar-img" src="../assets/avatars/avatar-alex.png" alt="Alex" />
                    </a>
                    <div class="conversation-row__body">
                      <div class="conversation-row__top">
                        <span class="conversation-row__name">Alex</span>
                        <span class="conversation-row__time">昨天</span>
                      </div>
                      <p class="conversation-row__preview">Let's practice your job interview.</p>
                    </div>
                  </div>
                </li>
                <li>
                  <div class="conversation-row">
                    <a class="conversation-row__avatar-link" href="partner-profile.html?partner=emma">
                      <img class="avatar-img" src="../assets/avatars/avatar-emma.png" alt="Emma" />
                    </a>
                    <div class="conversation-row__body">
                      <div class="conversation-row__top">
                        <span class="conversation-row__name">Emma</span>
                        <span class="conversation-row__time">昨天</span>
                      </div>
                      <p class="conversation-row__preview">How was your weekend?</p>
                    </div>
                  </div>
                </li>
                <li>
                  <div class="conversation-row">
                    <div class="avatar avatar--system">i</div>
                    <div class="conversation-row__body">
                      <div class="conversation-row__top">
                        <span class="conversation-row__name">系统消息</span>
                        <span class="conversation-row__time">周一</span>
                      </div>
                      <p class="conversation-row__preview">Sarah 整理了今天的学习反馈</p>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <nav class="tab-bar" aria-label="主导航">
        <span class="tab-bar__item tab-bar__item--active">
          <svg class="tab-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          消息
        </span>
        <span class="tab-bar__item">
          <svg class="tab-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          学习
        </span>
        <a class="tab-bar__item" href="moments.html" style="color:inherit">
          <svg class="tab-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
          朋友圈
        </a>
        <span class="tab-bar__item">
          <svg class="tab-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          我的
        </span>
      </nav>
      <div class="device__home-indicator device__home-indicator--dark"></div>
    </div>
  </div>
  <p class="screen-page__label">02 · Messages — 右上角切换 Light / Dark</p>
  <script src="../js/preview-theme.js"></script>
</body>
</html>
